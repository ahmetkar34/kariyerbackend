spring.application.name=kariyerbackend

spring.config.import=optional:file:.env[.properties]

# SQL Server connection
spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Batches lazy @ElementCollection loads (e.g. JobPosting tags/responsibilities/requirements)
# into IN-clause queries instead of one query per row, avoiding N+1 on paginated lists.
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Mail (Mailpit dev SMTP catcher, see docker-compose.yml)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Used to build links inside verification/reset emails
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
